name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, typecheck, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make lint
      - run: make typecheck
      - run: make build
      - run: make test-all

  # Ordinary push/PR gate: application gate + ONE fast Chromium smoke pass.
  # The deterministic full browser matrices (Chromium + Firefox) are qualified
  # on demand through .github/workflows/full-browser-qualification.yml
  # (workflow_dispatch) at milestone/release boundaries, not after every push.
  chromium-smoke:
    name: Chromium smoke
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Chromium smoke
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
        env:
          # Disposable state only: never reuse a checked-in/developer database.
          DB_FILE_NAME: ${{ runner.temp }}/trading-journal-playwright-smoke/journal.db
          PLAYWRIGHT_ARTIFACT_DIR: ${{ runner.temp }}/trading-journal-playwright-smoke
      - name: Upload Chromium smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-chromium
          path: ${{ runner.temp }}/trading-journal-playwright-smoke/
          if-no-files-found: error
          retention-days: 14
